<!DOCTYPE html>
<html>
<head>
  	<meta charset="utf-8">
  	<meta name="viewport" content="initial-scale=1, width=device-width">
  	
  	<link rel="stylesheet"  href="./css/cadastro.css" />
  	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" />
  	
  	
  	
</head>
<body>
  	
  	<div class="cadastro-pagina">
    		<div class="cadastro-pagina-child">
    		</div>
    		<b class="registro-de-clientes">Registro de Clientes e Endereços</b>
    		<div class="secao-clientes">
      			<div class="formulario">
                       <div class="cpf-input">
                            <label for="cpf" class="cpf-label">CPF:</label>
                            <input type="text" id="cpf" name="cpf" class="group-child" />
                        </div>
                    
        				<div class="nome-input">
                            <label for="nome-completo" class="label">Nome Completo:</label>
                            <input type="text" id="nome-completo" name="nome-completo" class="group-child" />
                        </div>
                        
        				<div class="data-de-nascimento-input">
                            <label for="data-de-nascimento" class="data-label">Data de Nascimento:</label>
                            <input type="date" id="data-de-nascimento" name="data-de-nascimento" class="group-child" />
                        </div>
                        
        				<div class="telefone-input">
                            <label for="telefone" class="tel-label">Telefone:</label>
                            <input  type="tel" id="telefone" name="telefone" class="group-child" />
                        </div>
                        
        				<div class="celular-input">
                            <label for="celular" class="cel-label">Celular:</label>
                            <input type="tel" id="celular" name="celular" class="group-child" />
                        </div>
                        
      			</div>
      			<b class="cliente">Cliente</b>
    		</div>
    		<div class="secao-endereco">
      			<div class="formulario1">
        				

                        <div class="cpf-input">
                            <label for="rua" class="rua-label">Rua:</label>
                            <input type="text" id="rua" name="rua" class="group-child" />
                        </div>


                        <div class="nome-input">
                            <label for="cep" class="cep-label">CEP:</label>
                            <input type="text" id="cep" name="cep" class="group-child">
                        </div>


                        <div class="data-de-nascimento-input">
                            <label for="bairro" class="bairro-label">Bairro:</label>
                            <input type="text" id="bairro" name="bairro" class="group-child">
                        </div>


                        <div class="telefone-input">
                            <label for="cidade" class="cidade-label">Cidade:</label>
                            <input type="text" id="cidade" name="cidade" class="group-child">
                        </div>
                        
                        <div class="celular-input">
                            <label for="estado" class="estado-label">Estado:</label>
                            <input type="text" id="estado" name="estado" class="group-child">
        
        				</div>
      			</div>
      			<b class="endereo">Endereço</b>
    		</div>


            <div class="estado-input1">
                <label for="pais" class="pais-label">País:</label>
                <input type="text" id="pais" name="pais" class="group-child">
            </div>


            <div class="estado-input2">
                <label for="id-do-cliente" class="id-label">ID do Cliente</label>
                <input type="number" id="id-do-cliente" name="id-do-cliente" class="group-child">
            </div>

    		<div class="registrar-cliente-botao">
      			<div class="registrar-cliente-botao-child">
      			</div>
      			<b class="registrar-cliente">Registrar Cliente </b>
    		</div>
    		<div class="registrar-endereco-botao">
      			<div class="registrar-cliente-botao-child">
      			</div>
      			<b class="registrar-endereo">Registrar Endereço </b>
    		</div>
    		<div class="exportar-banco-de-dados-botao">
      			<div class="registrar-cliente-botao-child">
      			</div>
      			<b class="exportar-banco-de">Exportar Banco de Dados</b>
    		</div>
    		<div class="upload-banco-de-dados-botao">
      			<div class="registrar-cliente-botao-child">
      			</div>
      			<b class="exportar-banco-de">Upload de Banco de Dados</b>
    		</div>
    		<div class="endereco-principal-secao">
      			<div class="endereo-principal">Endereço Principal</div>
      			<button class="endereco-principal-secao-child" id="enderecoPrincipalBotao">
                </button>
    		</div>
  	</div>
  	
  	
  	
  	
    <script src="./js/script.js"></script>
</body>
</html>
