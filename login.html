<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
</head>
<body>
    <div class="login">
	 
		<div class="alinhar">  <div class="login-child">
        </div>
        <b class="entrar">Entrar</b>
        <button id="redirecionar-para-inicio" class="voltar-botao">
            <img class="voltar-botao-child" alt="" src="Rectangle 8.svg">
            <div class="voltar">
                <span class="voltar1">Voltar</span>
            </div>
        </button>
        <div class="formulario-login">
            
			<button type="submit" class="fazer-login-botao">
				<div class="fazer-login-botao-child"></div>
				<b class="fazer-login">Fazer login</b>
			</button>

			<div class="password-input">
				<label for="senha" class="voltar1">Senha:</label>
				<input placeholder="Digite sua senha" type="password" id="senha" name="Senha" class="area-senha">
			</div>


			<div class="usuario-input">
				<label for="usuário" class="senha">Usuário:</label>
				<input placeholder="Digite de nome de usuário" type="text" id="usuario" name="Usuário" class="area-senha"> 
			</div></div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/alasql/1.5.7/alasql.min.js"></script>

    <script src="./js/script.js"></script>
</body>
</html>
