<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <link rel="stylesheet" href="./css/registrar.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
</head>
<body>
    
    <div class="registro-de-usuario">
        <div class="alinhar">
               <div class="registro-de-usuario-child"></div>
                <b class="registro-de-usurio">Registro de Usuário</b>

            <div class="formulario-registro">
            

                <div class="password-input">
                  <label for="senha-registrar" class="senha">Senha:</label>
                  <input placeholder="Digite sua senha" type="password" id="senha" name="senha" class="rectangle-parent">
                </div>

                <div class="usuario-input">
                  <label for="usuario" class="usuario">Usuário:</label>
                  <input placeholder="Digite seu nome de usuário" type="text" id="usuario" name="usuario" class="rectangle-parent">
                </div>

                <button  class="registrar-botao">
                  <div class="submit-child"></div>
                  <b class="registrar">Registrar</b>
                </button>
           </div>

           <button id="redirecionar-para-inicio" class="voltar-botao">
               <img class="voltar-botao-child" alt="" src="Rectangle 8.svg">
               <div class="voltar">
                  <p class="senha1">Voltar</p>
               </div>
           </button>
       </div>
    </div>

    

    <script src="./js/script.js"></script>
</body>
</html>
